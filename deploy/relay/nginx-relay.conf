# For servers that already run Nginx on ports 80/443: use this instead of the caddy service.
# 1. In docker-compose.lite.yml, remove the caddy service and publish new-api only locally:
#      ports: ["127.0.0.1:3000:3000"]
# 2. Copy this file to /etc/nginx/conf.d/, replace api.example.com, get a certificate
#    (e.g. certbot --nginx -d api.example.com), then: nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name api.example.com;

    # Source and reference images make requests of 20 MB and more.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Image generation can take minutes before the first byte comes back.
        proxy_read_timeout 1800s;
        proxy_send_timeout 300s;
        # Pass streamed answers through as they come.
        proxy_buffering off;
    }
}
