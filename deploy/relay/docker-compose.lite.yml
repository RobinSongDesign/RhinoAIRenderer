# Lightweight variant for small servers (e.g. 2 GB RAM shared with other services):
# new-api stores its data in SQLite under ./data, so there is no Postgres or Redis to run.
# Fine for a start (hundreds of users); move to docker-compose.yml when traffic grows.
# Usage: docker compose -f docker-compose.lite.yml up -d
services:
  caddy:
    image: caddy:2.8
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on:
      - new-api

  new-api:
    # Verified version; see docker-compose.yml.
    image: calciumion/new-api:${NEW_API_VERSION}
    restart: always
    command: --log-dir /app/logs
    expose:
      - "3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - NODE_NAME=chameleon-relay-1
    # Caps memory so the gateway cannot starve other services on the machine (and vice versa
    # the kernel kills the offender, not a random process). Image bodies are buffered in memory,
    # hence the headroom.
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\":true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3


  # Turns new-api's Gemini requests into APIMart's asynchronous image tasks (apimart-bridge/).
  # In new-api, add a Gemini channel with base URL http://apimart-bridge:8080 and the APIMart key.
  apimart-bridge:
    image: python:3.12-alpine
    restart: always
    command: ["python", "-u", "/app/apimart_bridge.py"]
    # Not published: only new-api talks to it, over the compose network.
    expose:
      - "8080"
    volumes:
      - ./apimart-bridge/apimart_bridge.py:/app/apimart_bridge.py:ro
    environment:
      - BRIDGE_OFFICIAL_FALLBACK=${BRIDGE_OFFICIAL_FALLBACK:-false}
      - BRIDGE_ERROR_LANGUAGE=${BRIDGE_ERROR_LANGUAGE:-zh}
      - BRIDGE_TASK_TIMEOUT_SECONDS=${BRIDGE_TASK_TIMEOUT_SECONDS:-240}
      - BRIDGE_MODEL_MAP=${BRIDGE_MODEL_MAP:-}
      - TZ=Asia/Shanghai
    read_only: true
    # Each waiting request holds its images in memory (a 4K result is about 20 MB as base64).
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz | grep -q ok || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
