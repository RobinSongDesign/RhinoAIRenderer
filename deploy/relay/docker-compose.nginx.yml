# For servers that already run Nginx on ports 80/443 and have little memory to spare:
# only new-api runs in Docker (SQLite under ./data), published on localhost for Nginx to proxy.
# Pair it with nginx-relay.conf. Usage: sudo docker compose -f docker-compose.nginx.yml up -d
services:
  new-api:
    # Verified version; see docker-compose.yml.
    image: calciumion/new-api:${NEW_API_VERSION}
    restart: always
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - NODE_NAME=chameleon-relay-1
    # Keeps the gateway and other services on the machine from starving each other.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\":true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Turns new-api's Gemini requests into APIMart's asynchronous image tasks (apimart-bridge/).
  # In new-api, add a Gemini channel with base URL http://apimart-bridge:8080 and the APIMart key.
  apimart-bridge:
    image: python:3.12-alpine
    restart: always
    command: ["python", "-u", "/app/apimart_bridge.py"]
    # Not published: only new-api talks to it, over the compose network.
    expose:
      - "8080"
    volumes:
      - ./apimart-bridge/apimart_bridge.py:/app/apimart_bridge.py:ro
    environment:
      - BRIDGE_OFFICIAL_FALLBACK=${BRIDGE_OFFICIAL_FALLBACK:-false}
      - BRIDGE_ERROR_LANGUAGE=${BRIDGE_ERROR_LANGUAGE:-zh}
      - BRIDGE_TASK_TIMEOUT_SECONDS=${BRIDGE_TASK_TIMEOUT_SECONDS:-240}
      - BRIDGE_MODEL_MAP=${BRIDGE_MODEL_MAP:-}
      - TZ=Asia/Shanghai
    read_only: true
    # Each waiting request holds its images in memory (a 4K result is about 20 MB as base64).
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz | grep -q ok || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Takes new-api's Epay payments to the operator's own Alipay merchant account (pay-bridge/).
  # Settings in pay.env (see pay-bridge/pay.env.example); Nginx forwards /pay/ to it.
  pay-bridge:
    build: ./pay-bridge
    restart: always
    env_file: ./pay.env
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./pay-data:/data
    read_only: true
    # SQLite may need scratch space; the rest of the file system stays read-only.
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8090/healthz | grep -q ok || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
