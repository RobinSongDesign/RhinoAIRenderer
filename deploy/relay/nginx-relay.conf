# For servers that already run Nginx on ports 80/443: use this instead of Caddy, together with
# docker-compose.nginx.yml (new-api published on 127.0.0.1:3000).
# Copy this file to /etc/nginx/conf.d/, replace api.example.com, run nginx -t and reload, then
# get a certificate with certbot --nginx -d api.example.com (it adds the 443 block).
server {
    listen 80;
    server_name api.example.com;

    # Source and reference images make requests of 20 MB and more.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Image generation can take minutes before the first byte comes back.
        proxy_read_timeout 1800s;
        proxy_send_timeout 300s;
        # Pass streamed answers through as they come.
        proxy_buffering off;
    }
}
