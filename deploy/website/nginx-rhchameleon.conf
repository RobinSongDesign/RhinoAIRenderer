# Product website rhchameleon.top (intro page and Markdown documentation from website/).
# The site is served from a checkout of the repository, e.g. /opt/rhchameleon-site:
#   sudo git clone --depth 1 -b <branch> https://github.com/RobinSongDesign/RhinoAIRenderer.git /opt/rhchameleon-site
# Copy this file to /etc/nginx/sites-available/, link it into sites-enabled, run nginx -t and
# reload, then add HTTPS with: sudo certbot --nginx -d rhchameleon.top -d www.rhchameleon.top
server {
    listen 80;
    server_name www.rhchameleon.top;
    return 301 $scheme://rhchameleon.top$request_uri;
}

server {
    listen 80;
    server_name rhchameleon.top;

    root /opt/rhchameleon-site/website;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    # Markdown pages are fetched by the documentation reader; the stock MIME table lacks .md.
    location ~ \.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
    }

    # /docs/network renders docs/network.md through docs/index.html.
    location /docs/ {
        try_files $uri /docs/index.html;
    }

    location = /docs {
        return 301 /docs/;
    }

    # Nothing outside website/ is published, and no dotfiles.
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
