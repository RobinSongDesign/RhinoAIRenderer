name: Release

# Builds the cross-platform plug-in, packages it for Rhino's package manager (Yak) and publishes
# a GitHub release. Tags v2.0.0 and later; a tag with a suffix (v2.0.0-beta.1) is a test build,
# published as a GitHub pre-release only, never pushed to the Yak server.
on:
  push:
    tags:
      - 'v[2-9]*'

permissions:
  contents: write

env:
  # Standalone Yak CLI for Linux build machines (the .NET 8 build), pinned for reproducible releases.
  YAK_URL: https://files.mcneel.com/yak/tools/0.15.1/linux-x64/yak

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: src/Chameleon.UI/pnpm-lock.yaml

      - name: Set version from tag
        id: version
        run: |
          python3 tools/scripts/set_version.py "${GITHUB_REF_NAME}"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Test
        run: dotnet test Chameleon.sln -c Release -p:SkipUi=true

      - name: Build front end
        run: |
          pnpm --dir src/Chameleon.UI install --frozen-lockfile
          pnpm --dir src/Chameleon.UI build

      - name: Build plug-in
        run: dotnet build src/Chameleon.Rhino/Chameleon.Rhino.csproj -c Release

      - name: Assemble package
        run: python3 tools/scripts/assemble_package.py src/Chameleon.Rhino/bin/Release dist/package

      - name: Build Yak package
        run: |
          curl -fsSL "$YAK_URL" -o yak
          chmod +x yak
          (cd dist/package && ../../yak build --platform any)
          mv dist/package/*.yak dist/
          ls -l dist

      - name: Zip framework folders
        run: |
          cd dist/package
          zip -r "../Chameleon-${{ steps.version.outputs.version }}-net7.0.zip" net7.0
          zip -r "../Chameleon-${{ steps.version.outputs.version }}-net48.zip" net48

      - name: Create GitHub release (test build)
        if: steps.version.outputs.prerelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Chameleon ${{ steps.version.outputs.version }}（测试版）
          prerelease: true
          files: |
            dist/*.yak
            dist/*.zip
          body: |
            ## Chameleon ${{ steps.version.outputs.version }}（测试版）

            测试版只发布在这里，不上架 Rhino 包管理器。需要 Rhino 8.19 或更高版本（含 Rhino 9），Windows 与 macOS 通用。

            ### 安装
            1. 装过旧版 AIRenderer 的，先在 Rhino 中执行 `PluginManager` 卸载它，并完全退出 Rhino（新旧版不能同时加载）。
            2. 下载 `Chameleon-${{ steps.version.outputs.version }}-net7.0.zip`，解压到一个固定的文件夹（之后不要移动）。
            3. 把其中的 `Chameleon.rhp` 拖入 Rhino 窗口，执行命令 `Chameleon`。
            - Windows 上以 `/netfx` 方式启动的 Rhino 8 用 `net48` 的 zip；`.yak` 文件也可以直接拖入 Rhino 安装。

            使用说明：https://rhchameleon.top/docs/getting-started

      - name: Create GitHub release
        if: steps.version.outputs.prerelease != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Chameleon ${{ steps.version.outputs.version }}
          prerelease: false
          files: |
            dist/*.yak
            dist/*.zip
          body: |
            ## Chameleon ${{ steps.version.outputs.version }}

            需要 Rhino 8.19 或更高版本（含 Rhino 9），Windows 与 macOS 通用。

            ### 安装
            - **包管理器（推荐）**：在 Rhino 中执行 `PackageManager`，搜索 Chameleon 安装。
            - **离线安装**：下载 `.yak` 文件，拖入 Rhino 窗口。
            - **手动安装**：下载对应的 zip 并解压，把其中的 `Chameleon.rhp` 拖入 Rhino 窗口。
              - `net7.0`：Rhino 8 / 9（Windows、macOS）
              - `net48`：Windows 上以 `/netfx` 方式启动的 Rhino 8

            安装后执行命令 `Chameleon`（旧命令 `AIRender` 仍可用）。

      - name: Publish to the Yak server
        # Test builds (tags with a suffix, e.g. v2.0.0-beta.1) are published on GitHub only.
        if: steps.version.outputs.prerelease != 'true'
        env:
          YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
        run: |
          if [ -z "$YAK_TOKEN" ]; then
            echo "YAK_TOKEN is not configured; skipping 'yak push'. The package is attached to the GitHub release."
            exit 0
          fi
          ./yak push dist/*.yak
