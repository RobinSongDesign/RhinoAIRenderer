name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  core:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Chameleon.sln -c Release

      - name: Test
        run: dotnet test Chameleon.sln -c Release --no-build

  ui:
    name: UI (lint, unit, build, end-to-end)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Chameleon.UI
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: src/Chameleon.UI/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

  legacy:
    name: Build legacy WPF plug-in (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x

      - name: Build net48
        run: dotnet build legacy/AIRenderer.csproj -c Release -f net48

      - name: Build net7.0-windows
        run: dotnet build legacy/AIRenderer.csproj -c Release -f net7.0-windows
